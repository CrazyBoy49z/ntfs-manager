[package]
name = "ntfs-manager"
version = "0.1.0"
edition = "2021"
description = "Safe macOS NTFS read/write manager powered by macFUSE and ntfs-3g"
license = "MIT"
repository = "https://github.com/CrazyBoy49z/ntfs-manager"
rust-version = "1.80"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.13"

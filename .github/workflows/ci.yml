name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Build
        run: cargo build --release --all-features

      - name: Validate scripts
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          test -s assets/panel.html

      - name: Validate launchd plists
        run: |
          plutil -lint packaging/dev.step2.ntfs-manager.helper.plist
          sed "s|__HOME__|$HOME|g" packaging/dev.step2.ntfs-manager.agent.plist > /tmp/ntfs-agent.plist
          sed "s|__HOME__|$HOME|g" packaging/dev.step2.ntfs-manager.menubar.plist > /tmp/ntfs-menubar.plist
          plutil -lint /tmp/ntfs-agent.plist
          plutil -lint /tmp/ntfs-menubar.plist

      - name: Package host app
        run: bash scripts/package-app.sh

      - name: Verify host app
        run: |
          test -s "dist/NTFS Manager.app/Contents/Resources/NTFSManager.icns"
          test -s "dist/NTFS Manager.app/Contents/Resources/NTFSManager.png"
          test -x "dist/NTFS Manager.app/Contents/Resources/repair-components.sh"
          sips -g hasAlpha "dist/NTFS Manager.app/Contents/Resources/NTFSManager.png" | grep -q "hasAlpha: yes"
          codesign --verify --deep --strict "dist/NTFS Manager.app"

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-universal

      - name: Resolve release version
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v$VERSION"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist; building release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Apple Silicon
        if: steps.release_meta.outputs.should_release == 'true'
        run: cargo build --release --all-features --target aarch64-apple-darwin

      - name: Build Intel
        if: steps.release_meta.outputs.should_release == 'true'
        run: cargo build --release --all-features --target x86_64-apple-darwin

      - name: Create Universal binaries
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          mkdir -p universal-bin
          for binary in ntfs-manager ntfs-manager-helper ntfs-manager-agent ntfs-manager-menubar; do
            lipo -create               "target/aarch64-apple-darwin/release/$binary"               "target/x86_64-apple-darwin/release/$binary"               -output "universal-bin/$binary"
            chmod +x "universal-bin/$binary"
          done

      - name: Package Universal app
        if: steps.release_meta.outputs.should_release == 'true'
        env:
          NTFS_MANAGER_BINARY_DIR: ${{ github.workspace }}/universal-bin
        run: bash scripts/package-app.sh

      - name: Verify Universal app
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          codesign --verify --deep --strict "dist/NTFS Manager.app"
          lipo -info "dist/NTFS Manager.app/Contents/MacOS/ntfs-manager-menubar"
          for binary in ntfs-manager ntfs-manager-helper ntfs-manager-agent; do
            lipo -info "dist/NTFS Manager.app/Contents/Resources/bin/$binary"
          done

      - name: Create ZIP and checksum
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          ZIP="dist/NTFS-Manager-$RELEASE_TAG-macOS-universal.zip"
          ditto             -c             -k             --sequesterRsrc             --keepParent             "dist/NTFS Manager.app"             "$ZIP"

          HASH="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "$(basename "$ZIP")" > "$ZIP.sha256"

      - name: Create GitHub Release
        if: steps.release_meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/NTFS-Manager-$RELEASE_TAG-macOS-universal.zip"
          gh release create "$RELEASE_TAG"             "$ZIP"             "$ZIP.sha256"             --title "NTFS Manager $RELEASE_TAG"             --generate-notes             --latest             --target "$GITHUB_SHA"

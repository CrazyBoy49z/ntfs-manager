name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release --all-features

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate launchd plists
        run: |
          plutil -lint packaging/dev.step2.ntfs-manager.helper.plist
          sed "s|__HOME__|$HOME|g" packaging/dev.step2.ntfs-manager.agent.plist > /tmp/ntfs-agent.plist
          sed "s|__HOME__|$HOME|g" packaging/dev.step2.ntfs-manager.menubar.plist > /tmp/ntfs-menubar.plist
          plutil -lint /tmp/ntfs-agent.plist
          plutil -lint /tmp/ntfs-menubar.plist

      - name: Build host app bundle
        run: bash scripts/package-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/NTFS Manager.app"

  universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: universal

      - name: Build Apple Silicon
        run: cargo build --release --all-features --target aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --all-features --target x86_64-apple-darwin

      - name: Create universal binaries
        run: |
          mkdir -p universal-bin
          for binary in ntfs-manager ntfs-manager-helper ntfs-manager-agent ntfs-manager-menubar; do
            lipo -create               "target/aarch64-apple-darwin/release/$binary"               "target/x86_64-apple-darwin/release/$binary"               -output "universal-bin/$binary"
            chmod +x "universal-bin/$binary"
            lipo -info "universal-bin/$binary"
          done

      - name: Package universal app
        env:
          NTFS_MANAGER_BINARY_DIR: ${{ github.workspace }}/universal-bin
        run: bash scripts/package-app.sh

      - name: Verify universal app
        run: |
          codesign --verify --deep --strict "dist/NTFS Manager.app"
          lipo -info "dist/NTFS Manager.app/Contents/MacOS/ntfs-manager-menubar"
          for binary in ntfs-manager ntfs-manager-helper ntfs-manager-agent; do
            lipo -info "dist/NTFS Manager.app/Contents/Resources/bin/$binary"
          done

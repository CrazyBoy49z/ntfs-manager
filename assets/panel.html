<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  color-scheme:dark;
  --bg:rgba(27,29,32,.965);
  --card:#2a2d31;
  --card2:#24272b;
  --border:rgba(255,255,255,.09);
  --muted:#9aa0a8;
  --text:#f5f7fa;
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --amber:#ffd60a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;color:var(--text);user-select:none}
button,select{font:inherit}
.shell{
  margin:8px;
  height:calc(100% - 16px);
  border-radius:17px;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(47,50,54,.98),rgba(24,26,29,.98));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 16px 44px rgba(0,0,0,.46);
}
.content{height:100%;overflow:auto;padding:14px}
.content::-webkit-scrollbar{width:0}
.header{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.app-icon{
  width:38px;height:38px;border-radius:9px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#0c4d89,#091a2a);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13);
  flex:0 0 auto;
}
.drive{width:27px;height:27px}
.header-copy{min-width:0;flex:1}
.title{font-weight:700;font-size:15px;line-height:18px}
.subtitle{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-line{display:flex;align-items:center;gap:7px;min-width:0}
.version-badge{font-size:9.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.icon-btn{
  width:31px;height:31px;border:0;border-radius:8px;background:transparent;color:#c8cbd0;
  display:grid;place-items:center;font-size:18px;cursor:pointer
}
.icon-btn:hover{background:rgba(255,255,255,.08);color:white}
.row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 2px;border-top:1px solid var(--border)
}
.label{font-size:13px}
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:13px 0 8px;color:#a7acb4;font-size:11px;font-weight:650;
  text-transform:uppercase;letter-spacing:.03em
}
.switch{position:relative;width:37px;height:22px;flex:0 0 auto}
.switch input{display:none}
.slider{
  position:absolute;inset:0;border-radius:999px;background:#5a5e64;transition:.15s;cursor:pointer
}
.slider:after{
  content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;border-radius:50%;
  background:white;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.15s
}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider:after{transform:translateX(15px)}
.disks{display:flex;flex-direction:column;gap:8px}
.disk{
  border:1px solid var(--border);border-radius:12px;background:var(--card2);overflow:hidden;
  transition:border-color .15s,background .15s
}
.disk.ntfs{background:linear-gradient(180deg,#2b3035,#24282d)}
.disk-head{display:flex;align-items:center;gap:9px;padding:10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#747b84;flex:0 0 auto}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(48,209,88,.45)}
.dot.amber{background:var(--amber)}
.fs-icon{
  width:32px;height:32px;border-radius:7px;background:linear-gradient(#dce1e6,#8d969e);
  color:#1d252d;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.4)
}
.disk-copy{min-width:0;flex:1}
.disk-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disk-meta{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:15px;color:#a8adb4;transition:transform .15s}
.disk.open .chev{transform:rotate(180deg)}
.disk-actions{display:none;gap:7px;padding:0 10px 10px}
.disk.open .disk-actions{display:flex}
.action{
  border:0;border-radius:8px;padding:7px 10px;font-size:11.5px;cursor:pointer;color:white;
  background:#3a3f45;flex:1;white-space:nowrap
}
.action.primary{background:var(--blue)}
.action.danger{background:#4a3030}
.action:disabled{opacity:.45;cursor:default}
.quick{display:flex;gap:7px}
.quick .action{padding:8px}
.banner{
  display:none;margin:0 0 10px;padding:9px 10px;border-radius:9px;
  background:rgba(255,69,58,.13);border:1px solid rgba(255,69,58,.32);color:#ffd7d3;
  font-size:10.5px;line-height:1.35
}
.banner.show{display:block}
.update-banner{
  display:none;margin:0 0 10px;padding:10px;border-radius:10px;
  background:rgba(10,132,255,.13);border:1px solid rgba(10,132,255,.34)
}
.update-banner.show{display:block}
.update-title{font-size:12.5px;font-weight:700}
.update-copy{font-size:10.5px;color:#c7d8ec;margin-top:3px;line-height:1.35}
.update-actions{display:flex;gap:7px;margin-top:9px}
.update-actions button{flex:1}
.footer{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.footer button{flex:0 0 auto;min-width:92px}
.empty{
  padding:18px 8px;text-align:center;border:1px dashed rgba(255,255,255,.12);
  border-radius:10px;color:var(--muted);font-size:12px
}
.view{display:none}.view.active{display:block}
.settings-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;margin-bottom:12px}
.settings-group{
  border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--card2);margin-bottom:10px
}
.settings-group .row{padding:10px;border-top:1px solid var(--border)}
.settings-group .row:first-child{border-top:0}
.settings-copy{min-width:0;flex:1}
.settings-copy .label{font-size:12.5px}
.hint{font-size:10px;color:var(--muted);margin-top:2px}
.small-btn{
  border:0;border-radius:7px;padding:6px 8px;background:#3b4046;color:white;font-size:10.5px;cursor:pointer
}
.status-pill{font-size:9px;padding:3px 6px;border-radius:999px;background:#3a4046;color:#c9cdd2}
.status-pill.ok{background:rgba(48,209,88,.16);color:#8af0a5}
.locale-select{min-width:88px;border:0;border-radius:7px;padding:6px 28px 6px 9px;background:#3b4046;color:white;font-size:10.5px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <div class="content">
    <section id="mainView" class="view active">
      <div class="header">
        <div class="app-icon">
          <svg class="drive" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#aeb7c0"/></linearGradient></defs>
            <path d="M17 10h30l7 34H10l7-34Z" fill="url(#g)" stroke="#fff" stroke-width="2"/>
            <rect x="9" y="41" width="46" height="13" rx="4" fill="#727b84" stroke="#b6bec5"/>
            <rect x="20" y="46" width="24" height="4" rx="2" fill="#17202a"/>
            <circle cx="15" cy="47.5" r="2.5" fill="#0a84ff"/>
            <circle cx="49" cy="47.5" r="2.5" fill="#30d158"/>
            <rect x="18" y="23" width="28" height="11" rx="3" fill="#24578d"/>
            <text x="32" y="31" text-anchor="middle" font-size="8" font-weight="800" fill="white">NTFS</text>
          </svg>
        </div>
        <div class="header-copy">
          <div class="title-line">
            <div class="title">NTFS Manager</div>
            <div id="headerVersion" class="version-badge">—</div>
          </div>
          <div id="summary" class="subtitle">Loading…</div>
        </div>
        <button class="icon-btn" onclick="showSettings()" id="settingsButton" title="Налаштування">⚙︎</button>
      </div>

      <div id="errorBanner" class="banner"></div>
      <div id="updateBanner" class="update-banner">
        <div class="update-title" id="updateTitle"></div>
        <div class="update-copy" id="updateCopy"></div>
        <div class="update-actions">
          <button id="installUpdate" class="action primary" onclick="send('install-update')"></button>
          <button id="dismissUpdate" class="action" onclick="send('dismiss-update')"></button>
        </div>
      </div>

      <div class="section-title">
        <span id="diskCount"></span>
        <button class="icon-btn" style="width:24px;height:24px;font-size:14px" onclick="send('refresh')" id="refreshButton" title="Оновити">↻</button>
      </div>
      <div id="disks" class="disks"></div>

      <div id="quickActionsSection">
        <div class="section-title"><span id="quickActionsTitle"></span></div>
        <div class="quick">
          <button id="mountAll" class="action primary" onclick="send('mount-all')"></button>
        </div>
      </div>

      <div class="footer">
        <button class="action" onclick="send('quit')">⏻ <span id="quitLabelMain"></span></button>
      </div>
    </section>

    <section id="settingsView" class="view">
      <div class="settings-title">
        <button class="icon-btn" onclick="showMain()">‹</button>
        <span id="settingsTitle"></span>
      </div>

      <div class="section-title"><span id="generalTitle"></span></div>
      <div class="settings-group">
        <div class="row">
          <div class="settings-copy"><div class="label" id="autoMountLabel"></div><div class="hint" id="autoMountHint"></div></div>
          <label class="switch"><input id="settingsAutoMount" type="checkbox" onchange="send('set-auto-mount',{enabled:this.checked})"><span class="slider"></span></label>
        </div>
        <div class="row">
          <div class="settings-copy"><div class="label" id="launchLabel"></div><div class="hint" id="launchHint"></div></div>
          <label class="switch"><input id="launchAtLogin" type="checkbox" onchange="send('set-launch-at-login',{enabled:this.checked})"><span class="slider"></span></label>
        </div>
        <div class="row">
          <div class="settings-copy"><div class="label" id="checkUpdatesLabel"></div><div class="hint" id="checkUpdatesHint"></div></div>
          <label class="switch"><input id="checkUpdates" type="checkbox" onchange="send('set-check-updates',{enabled:this.checked})"><span class="slider"></span></label>
        </div>
        <div class="row">
          <div class="settings-copy"><div class="label" id="languageLabel"></div><div class="hint" id="languageHint"></div></div>
          <select id="localeSelect" class="locale-select" onchange="send('set-locale',{locale:this.value})"><option value="uk">Українська</option><option value="en">English</option></select>
        </div>
      </div>

      <div id="componentsSection">
        <div class="section-title"><span id="componentsTitle"></span></div>
        <div class="settings-group">
          <div class="row">
            <div class="settings-copy"><div class="label" id="helperLabel"></div><div class="hint" id="helperVersion">—</div></div>
            <span id="helperStatus" class="status-pill">Checking</span>
          </div>
          <div class="row">
            <div class="settings-copy"><div class="label" id="repairLabel"></div><div class="hint" id="repairHint"></div></div>
            <button class="small-btn" onclick="send('repair')" id="repairButton"></button>
          </div>
        </div>
      </div>

      <div class="section-title"><span id="updatesTitle"></span></div>
      <div class="settings-group">
        <div class="row">
          <div class="settings-copy"><div class="label" id="updateLabel"></div><div class="hint" id="updateStatus"></div></div>
          <button id="checkUpdateButton" class="small-btn" onclick="send('check-update-now')"></button>
        </div>
      </div>

      <div class="section-title"><span id="advancedTitle"></span></div>
      <div class="settings-group">
        <div id="moveRow" class="row">
          <div class="settings-copy"><div class="label" id="applicationsLabel"></div><div class="hint" id="applicationsHint"></div></div>
          <button class="small-btn" onclick="send('move-to-applications')" id="moveButton"></button>
        </div>
        <div class="row">
          <div class="settings-copy"><div class="label" id="logsLabel"></div><div class="hint" id="logsHint"></div></div>
          <button class="small-btn" onclick="send('open-logs')" id="openLogsButton"></button>
        </div>
      </div>

      <div class="footer">
        <button class="action" onclick="showMain()" id="doneButton"></button>
        <button class="action" onclick="send('quit')" id="quitSettingsButton"></button>
      </div>
    </section>
  </div>
</div>
<script>
let state=null;
let locale='uk';
const i18n={
uk:{settings:'Налаштування',connected:'Підключені диски',empty:'Немає підключених зовнішніх дисків',quick:'Швидкі дії',mountAll:'▶ Змонтувати всі NTFS',quit:'Вийти',general:'Основні',auto:'Автомонтування NTFS',autoHint:'Автоматично перемонтовувати NTFS у режимі read/write',launch:'Запускати при вході',launchHint:'Запускати NTFS Manager після входу в macOS',checkUpdates:'Перевіряти оновлення',checkUpdatesHint:'Автоматично перевіряти GitHub Releases і питати перед встановленням',language:'Мова',languageHint:'Мова інтерфейсу NTFS Manager',components:'Компоненти',helper:'Привілейований helper',ready:'Готово',needsRepair:'Потрібне відновлення',notInstalled:'Не встановлено',repair:'Відновити компоненти',repairHint:'Оновити helper/agent без Terminal, якщо залежності вже встановлені',repairButton:'Відновити',updates:'Оновлення',update:'Оновлення',check:'Перевірити',advanced:'Додатково',apps:'Applications',appsHint:'Перемістити NTFS Manager у /Applications',move:'Перемістити',logs:'Логи',logsHint:'Відкрити папку з діагностикою',open:'Відкрити',done:'Готово',updateAvailable:'Доступне оновлення',installing:'Завантаження, перевірка та встановлення…',updateDescription:'NTFS Manager завантажить і перевірить оновлення, а потім перезапуститься.',later:'Пізніше',updating:'Оновлення…',available:'Доступна',checking:'Перевіряю…',upToDate:'Актуальна версія',readWrite:'Read/write',readOnly:'Тільки читання',notMounted:'Не змонтовано',mounted:'Змонтовано',mountRW:'▶ Змонтувати read/write',finder:'▣ Відкрити у Finder',unmount:'Відмонтувати',refresh:'Оновити'},
en:{settings:'Settings',connected:'Connected disks',empty:'No external disks connected',quick:'Quick actions',mountAll:'▶ Mount all NTFS',quit:'Quit',general:'General',auto:'Auto-mount NTFS',autoHint:'Automatically remount NTFS volumes read/write',launch:'Launch at login',launchHint:'Launch NTFS Manager after signing in to macOS',checkUpdates:'Check for updates',checkUpdatesHint:'Automatically check GitHub Releases and ask before installing',language:'Language',languageHint:'NTFS Manager interface language',components:'Components',helper:'Privileged helper',ready:'Ready',needsRepair:'Needs repair',notInstalled:'Not installed',repair:'Repair components',repairHint:'Update helper/agent without Terminal when dependencies are already installed',repairButton:'Repair',updates:'Updates',update:'Update',check:'Check',advanced:'Advanced',apps:'Applications',appsHint:'Move NTFS Manager to /Applications',move:'Move',logs:'Logs',logsHint:'Open diagnostics folder',open:'Open',done:'Done',updateAvailable:'Update available',installing:'Downloading, verifying and installing…',updateDescription:'NTFS Manager will download and verify the update, then restart.',later:'Later',updating:'Updating…',available:'Available',checking:'Checking…',upToDate:'Up to date',readWrite:'Read/write',readOnly:'Read-only',notMounted:'Not mounted',mounted:'Mounted',mountRW:'▶ Mount read/write',finder:'▣ Open in Finder',unmount:'Unmount',refresh:'Refresh'}
};
function t(k){return i18n[locale]?.[k]??i18n.en[k]??k}
function applyLocale(){
 document.documentElement.lang=locale;
 const map={settingsTitle:'settings',quickActionsTitle:'quick',generalTitle:'general',autoMountLabel:'auto',autoMountHint:'autoHint',launchLabel:'launch',launchHint:'launchHint',checkUpdatesLabel:'checkUpdates',checkUpdatesHint:'checkUpdatesHint',languageLabel:'language',languageHint:'languageHint',componentsTitle:'components',helperLabel:'helper',repairLabel:'repair',repairHint:'repairHint',repairButton:'repairButton',updatesTitle:'updates',updateLabel:'update',advancedTitle:'advanced',applicationsLabel:'apps',applicationsHint:'appsHint',moveButton:'move',logsLabel:'logs',logsHint:'logsHint',openLogsButton:'open',doneButton:'done',quitSettingsButton:'quit',quitLabelMain:'quit'};
 for(const [id,key] of Object.entries(map)){const el=document.getElementById(id);if(el)el.textContent=t(key)}
 document.getElementById('settingsButton').title=t('settings');document.getElementById('refreshButton').title=t('refresh');
 if(state)renderState(state);
}
function send(action,payload={}){
  window.ipc.postMessage(JSON.stringify({action,...payload}));
}
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function fmtBytes(v){
  if(!v) return '';
  if(v>=1e12) return (v/1e12).toFixed(1)+' TB';
  if(v>=1e9) return Math.round(v/1e9)+' GB';
  return Math.round(v/1e6)+' MB';
}
function showSettings(){
  document.getElementById('mainView').classList.remove('active');
  document.getElementById('settingsView').classList.add('active');
}
function showMain(){
  document.getElementById('settingsView').classList.remove('active');
  document.getElementById('mainView').classList.add('active');
}
function toggleDisk(id){
  document.getElementById(id)?.classList.toggle('open');
}
function renderVolumes(volumes){
  const root=document.getElementById('disks');
  root.innerHTML='';
  document.getElementById('diskCount').textContent=t('connected')+' ('+volumes.length+')';
  if(!volumes.length){
    root.innerHTML='<div class="empty">'+t('empty')+'</div>';
    return;
  }
  volumes.forEach((v,i)=>{
    const open=!!v.mount_point;
    const stateText=v.is_ntfs?(v.writable?t('readWrite'):(v.mounted?t('readOnly'):t('notMounted'))):(v.mounted?t('mounted'):t('notMounted'));
    const dot=v.is_ntfs?(v.writable?'green':(v.mounted?'amber':'')):'';
    const actions=[];
    if(v.is_ntfs && !v.writable) actions.push('<button class="action primary" onclick="event.stopPropagation();send(\'mount\',{device:\''+esc(v.device)+'\'})">'+t('mountRW')+'</button>');
    if(open) actions.push('<button class="action" onclick="event.stopPropagation();send(\'open-volume\',{device:\''+esc(v.device)+'\'})">'+t('finder')+'</button>');
    if(v.is_ntfs && open) actions.push('<button class="action danger" onclick="event.stopPropagation();send(\'unmount\',{device:\''+esc(v.device)+'\'})">'+t('unmount')+'</button>');
    const fs=esc(v.filesystem || (v.is_ntfs?'NTFS':'Disk'));
    const size=fmtBytes(v.size_bytes);
    const id='disk-'+i;
    root.insertAdjacentHTML('beforeend',
      '<div id="'+id+'" class="disk '+(v.is_ntfs?'ntfs ':'')+(v.is_ntfs?'open':'')+'">'+
      '<div class="disk-head" onclick="toggleDisk(\''+id+'\')">'+
      '<span class="dot '+dot+'"></span>'+
      '<div class="fs-icon">'+fs.replace(/[^A-Za-z0-9]/g,'').slice(0,5).toUpperCase()+'</div>'+
      '<div class="disk-copy"><div class="disk-name">'+esc(v.name || v.device)+'</div>'+
      '<div class="disk-meta">/dev/'+esc(v.device)+' · '+fs+(size?' · '+size:'')+' · '+stateText+'</div></div>'+
      '<span class="chev">⌄</span></div>'+
      (actions.length?'<div class="disk-actions">'+actions.join('')+'</div>':'')+
      '</div>');
  });
}
function renderState(next){
    document.getElementById('summary').textContent=next.summary || 'NTFS Manager';
    document.getElementById('headerVersion').textContent='v'+next.version;
    document.getElementById('settingsAutoMount').checked=!!next.auto_mount;
    document.getElementById('launchAtLogin').checked=!!next.launch_at_login;
    document.getElementById('checkUpdates').checked=!!next.check_updates;
    document.getElementById('localeSelect').value=locale;
    document.getElementById('helperVersion').textContent=next.helper_version ? 'v'+next.helper_version : t('notInstalled');
    const hs=document.getElementById('helperStatus');
    hs.textContent=next.helper_ready?t('ready'):t('needsRepair');
    hs.className='status-pill'+(next.helper_ready?' ok':'');
    document.getElementById('componentsSection').classList.toggle('hidden',!!next.helper_ready);
    document.getElementById('moveRow').style.display=next.installed_in_applications?'none':'flex';
    const banner=document.getElementById('errorBanner');
    banner.textContent=next.error || '';
    banner.classList.toggle('show',!!next.error);

    const updateBanner=document.getElementById('updateBanner');
    const updateTitle=document.getElementById('updateTitle');
    const updateCopy=document.getElementById('updateCopy');
    const installUpdate=document.getElementById('installUpdate');
    const dismissUpdate=document.getElementById('dismissUpdate');
    const updateStatus=document.getElementById('updateStatus');
    const checkUpdateButton=document.getElementById('checkUpdateButton');

    if(next.update_available){
      updateBanner.classList.add('show');
      updateTitle.textContent=t('updateAvailable')+' v'+next.update_available.version;
      updateCopy.textContent=next.update_installing
        ? t('installing')
        : t('updateDescription');
      installUpdate.disabled=!!next.update_installing;
      dismissUpdate.disabled=!!next.update_installing;
      installUpdate.textContent=next.update_installing?t('updating'):t('update');
      dismissUpdate.textContent=t('later');
      updateStatus.textContent=t('available')+' v'+next.update_available.version;
      checkUpdateButton.textContent=t('update');
      checkUpdateButton.onclick=()=>send('install-update');
    }else{
      updateBanner.classList.remove('show');
      updateStatus.textContent=next.update_checking?t('checking'):t('upToDate')+' · v'+next.version;
      checkUpdateButton.textContent=next.update_checking?'…':t('check');
      checkUpdateButton.disabled=!!next.update_checking;
      checkUpdateButton.onclick=()=>send('check-update-now');
    }

    renderVolumes(next.volumes || []);
    const ntfs=(next.volumes||[]).filter(v=>v.is_ntfs);
    const canMount=ntfs.some(v=>!v.writable);
    const mountAll=document.getElementById('mountAll');
    const quickActionsSection=document.getElementById('quickActionsSection');
    quickActionsSection.classList.toggle('hidden',!canMount);
    mountAll.disabled=!next.helper_ready || next.action_in_flight || !canMount;
    mountAll.textContent=t('mountAll')+' ('+ntfs.filter(v=>!v.writable).length+')';
}
window.ntfsManager={updateState(next){state=next;locale=next.locale==='en'?'en':'uk';applyLocale();}};
applyLocale();
send('ready');
</script>
</body>
</html>
